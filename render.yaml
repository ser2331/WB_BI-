# Blueprint для деплоя бэкенда на Render
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: wb-bi-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DEBUG
        value: "false"
      - key: MOCK_WB
        value: "true"
      - key: AUTO_SEED_MOCK
        value: "true"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/wb_bi.db
      - key: CORS_ORIGINS
        sync: false
        # Пример после деплоя GitHub Pages:
        # https://YOUR_USERNAME.github.io,http://localhost:5173
